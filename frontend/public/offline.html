<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1b2e" />
  <title>Sin conexión · Medic-KG</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
      background: #0d1b2e; color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    .caja { max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 18px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; color: #fff; }
    p { color: #94a3b8; line-height: 1.5; margin: 0 0 22px; font-size: .95rem; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 12px 26px; font-size: 1rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="caja">
    <img src="/icons/icon-192.png" alt="Medic-KG" />
    <h1>Sin conexión a internet</h1>
    <p>Medic-KG necesita internet para mostrar la información de la clínica. Revisa tu conexión e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
